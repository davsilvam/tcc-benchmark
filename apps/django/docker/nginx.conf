# Proxy reverso à frente do Gunicorn — seção 6.2.
# A documentação do Gunicorn determina que ele seja executado atrás de um servidor proxy.
# Sem isso o worker síncrono responde `Connection: close` e abre uma conexão TCP por
# requisição, o que fazia o Django pagar estabelecimento de conexão em toda requisição
# enquanto os outros quatro tratamentos não pagavam.
upstream gunicorn {
    server unix:/run/gunicorn/gunicorn.sock;
}

server {
    listen 8080 default_server;
    server_name _;

    # Sem compressão de resposta e sem log de requisições (seção 6.1).
    gzip off;
    access_log off;

    location / {
        proxy_pass http://gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
