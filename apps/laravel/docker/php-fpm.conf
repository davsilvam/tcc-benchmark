; Concorrencia — seção 6.2 da especificação.
; pm = static com 10 processos filhos: cada um mantém uma conexão PDO persistente, de modo
; que o agregado de conexões ao banco seja 10, igual ao pool fixo dos demais tratamentos.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = static
pm.max_children = 10
pm.max_requests = 0

; clear_env = no é obrigatório: sem ele as variáveis DB_* do contêiner não chegam aos
; processos filhos do PHP-FPM e a aplicação cairia nos padrões do .env.
clear_env = no

catch_workers_output = yes
access.log = /dev/null
