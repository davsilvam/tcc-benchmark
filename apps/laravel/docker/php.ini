; Modo de produção — seção 6.1 da especificação.
display_errors = Off
expose_php = Off
memory_limit = 256M

; OPcache com validate_timestamps desativado é a configuração de produção recomendada pela
; documentação do PHP: sem ele cada requisição recompilaria os arquivos-fonte e a medição
; refletiria a ausência de uma etapa que qualquer implantação real executa.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
